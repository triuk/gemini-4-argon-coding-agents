# Google Application Default Credentials; no API key in this config.
model_list:
  - model_name: gemini-4-argon
    litellm_params:
      model: vertex_ai/gemini-4-argon
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: global

litellm_settings:
  callbacks: argon_hooks.proxy_handler_instance
  drop_params: true
  modify_params: true

router_settings:
  disable_cooldowns: true

# Both the Linux and Windows proxy launchers bind to loopback only.
general_settings:
  dangerously_permit_weak_or_unset_master_key: true
